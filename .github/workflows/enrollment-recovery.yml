name: Recuperacao manual do cadastro
on:
  push:
    branches: [main]
    paths:
      - tools/Reset-RestoreWinEnrollment.ps1
      - tests/test_enrollment_recovery.ps1
      - .github/workflows/enrollment-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validar com Windows PowerShell 5.1 em pastas descartaveis
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./tests/test_enrollment_recovery.ps1
      - name: Validar com PowerShell 7 em pastas descartaveis
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tests/test_enrollment_recovery.ps1
